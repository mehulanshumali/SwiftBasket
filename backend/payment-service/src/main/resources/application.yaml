server:
  port: 8085 # Unique port for Payment Service

spring:
  application:
    name: payment-service

  # Primary Database (MySQL)
  datasource:
    url: jdbc:mysql://localhost:3307/payment_db?useSSL=false&allowPublicKeyRetrieval=true
    username: swiftbasket_user
    password: securepass
  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by infra/mysql_init.sql - never auto-managed

  # Kafka Config
  kafka:
    bootstrap-servers: localhost:9092
    # CONSUMER: Listens for order.placed (payment-group)
    consumer:
      group-id: payment-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # map producer's type id (order-service) to our local copy of the event
        spring.json.type.mapping: com.SwiftBasket.order_service.event.OrderPlacedEvent:com.SwiftBasket.payment_service.event.OrderPlacedEvent
    # PRODUCER: Publishes payment.completed and payment.failed
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Stripe (test mode; env vars - dummy values work for boot)
stripe:
  api-key: ${STRIPE_API_KEY:sk_test_dummy}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_dummy}

# Internal service URLs (direct, not via Kong)
order:
  service:
    url: http://localhost:8084

kafka_topic:
  order_placed: order.placed
  payment_completed: payment.completed
  payment_failed: payment.failed
