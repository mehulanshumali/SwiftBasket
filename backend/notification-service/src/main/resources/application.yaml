server:
  port: 8086 # Unique port for Notification Service

spring:
  application:
    name: notification-service

  # Primary Database (MySQL)
  datasource:
    url: jdbc:mysql://localhost:3307/notification_db?useSSL=false&allowPublicKeyRetrieval=true
    username: swiftbasket_user
    password: securepass
  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by infra/mysql_init.sql - never auto-managed

  # Mail Server (Mailtrap - development SMTP; real creds via env vars)
  mail:
    host: smtp.mailtrap.io
    port: 2525
    username: ${MAILTRAP_USERNAME:mailtrap_dummy}
    password: ${MAILTRAP_PASSWORD:mailtrap_dummy}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  # Kafka Consumer (listens to ALL notification topics)
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # map producer type ids (from other services) to local copies of the events
        spring.json.type.mapping: >
          com.SwiftBasket.user_service.event.UserRegisteredEvent:com.SwiftBasket.notification_service.event.UserRegisteredEvent,
          com.SwiftBasket.order_service.event.OrderPlacedEvent:com.SwiftBasket.notification_service.event.OrderPlacedEvent,
          com.SwiftBasket.payment_service.event.PaymentCompletedEvent:com.SwiftBasket.notification_service.event.PaymentCompletedEvent,
          com.SwiftBasket.order_service.event.OrderStatusUpdatedEvent:com.SwiftBasket.notification_service.event.OrderStatusUpdatedEvent

# Internal service URLs (direct, not via Kong) + email resolution cache TTL (claim-check)
user:
  service:
    url: http://localhost:8081
  cache:
    ttl-minutes: 15

kafka_topic:
  user_registered: user.registered
  order_placed: order.placed
  payment_completed: payment.completed
  order_status_updated: order.status.updated
