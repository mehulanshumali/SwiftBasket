server:
  port: 8081  # Unique port for User Service

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/user_db?useSSL=false&allowPublicKeyRetrieval=true
    username: swiftbasket_user
    password: securepass
  jpa:
    hibernate:
      ddl-auto: update # Automatically creates tables based on @Entity classes
    show-sql: true
  
  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-this-must-be-at-least-64-bytes-long-ok!!}
  expiration: 86400000  # 24 hours in milliseconds

# Kafka Topics
kafka_topic:
  name: user.registered

# SendGrid Configuration
sendgrid:
  api-key: ${SENDGRID_API_KEY}  # Uses environment variable
  from-email: victorfienkel0@gmail.com
  from-name: SwiftBasket Support

app:
  base-url: http://localhost:8081

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method  # Sort by HTTP method (GET, POST, etc.)
    tags-sorter: alpha  # Sort tags alphabetically
    display-request-duration: true