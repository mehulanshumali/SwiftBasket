server:
  port: 8081  # Unique port for User Service

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/user_db?useSSL=false&allowPublicKeyRetrieval=true
    username: swiftbasket_user
    password: securepass
  jpa:
    hibernate:
      ddl-auto: update # Automatically creates tables based on @Entity classes
    show-sql: true
  
  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# JWT Configuration
jwt:
  secret: your-secret-key-min-32-characters-long-please-change-this-in-production
  expiration: 86400000  # 24 hours in milliseconds

# Kafka Topics
kafka_topic:
  name: user.registered

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method  # Sort by HTTP method (GET, POST, etc.)
    tags-sorter: alpha  # Sort tags alphabetically
    display-request-duration: true
