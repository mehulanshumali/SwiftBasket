server:
  port: 8082 # Unique port

spring:
  application:
    name: product-service
  
  # Primary Database (MySQL)
  datasource:
    url: jdbc:mysql://localhost:3307/product_db?useSSL=false&allowPublicKeyRetrieval=true
    username: swiftbasket_user
    password: securepass
  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by infra/mysql_init.sql - never auto-managed

  # Search Engine (Elasticsearch)
  elasticsearch:
    uris: http://localhost:9200
    socket-timeout: 10000ms

  # Kafka (To listen for stock updates or publish product changes)
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer