version: '3.8'

services:
  # ------------------------------------------------------------
  # MySQL - Stores User, Product, Order, and Payment data 
  # ------------------------------------------------------------
  mysqldb:
    image: mysql:8.0
    container_name: swiftbasket-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: swiftbasket_user
      MYSQL_PASSWORD: securepass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Mounts the init script to create all 4 DBs automatically
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - swiftbasket-net

  # ------------------------------------------------------------
  # MongoDB - Stores Cart data (Flexible Schema) 
  # ------------------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: swiftbasket-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - swiftbasket-net

  # ------------------------------------------------------------
  # Redis - Caching for Cart Service 
  # ------------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: swiftbasket-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - swiftbasket-net

  # ------------------------------------------------------------
  # Zookeeper - Required for Kafka [cite: 73]
  # ------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: swiftbasket-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - swiftbasket-net

  # ------------------------------------------------------------
  # Kafka - Message Broker 
  # ------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: swiftbasket-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Listeners allow connecting from inside Docker (INTERNAL) and your Local Machine (EXTERNAL)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - swiftbasket-net

  # ------------------------------------------------------------
  # Elasticsearch - For Product Search 
  # ------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: swiftbasket-elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Limit memory usage
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - swiftbasket-net
  
  # ------------------------------------------------------------
  # Zipkin - Distributed Tracing (New)
  # ------------------------------------------------------------
  zipkin:
    image: openzipkin/zipkin
    container_name: ecommerce-zipkin
    ports:
      - "9411:9411"
    networks:
      - ecommerce-net

# ------------------------------------------------------------
# Volumes & Networks
# ------------------------------------------------------------
volumes:
  mysql_data:
  mongo_data:
  es_data:

networks:
  swiftbasket-net:
    driver: bridge