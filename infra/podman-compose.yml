version: '3.8'

# Podman Compose compatibility notes:
# - Use `podman-compose -f infra/podman-compose.yml up -d`
# - For macOS/Windows with Podman Desktop, ensure Podman machine is running
# - Spring Boot services run on the HOST; containers reach them via host.docker.internal

services:
  # ------------------------------------------------------------
  # Kong - API Gateway (DBless, declarative config in kong.yml)
  # ------------------------------------------------------------
  kong:
    image: docker.io/library/kong:3.9
    container_name: swiftbasket-kong
    restart: always
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: notice
      # pre-function auth needs resty.http, which Kong's Lua sandbox blocks
      # (sandbox is for untrusted code; ours is our own declarative config)
      KONG_UNTRUSTED_LUA: "on"
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    extra_hosts:
      # Alias the Docker name to Podman's host gateway. podman-compose 1.5
      # cannot resolve "host-gateway", so the static gateway IP is used
      # (192.168.127.254 = host.containers.internal on the podman machine).
      - "host.docker.internal:192.168.127.254"
    networks:
      - swiftbasket-net
    healthcheck:
      test: ["CMD-SHELL", "kong health"]
      timeout: 10s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------
  # MySQL - Stores all 5 service databases
  # ------------------------------------------------------------
  mysqldb:
    image: docker.io/library/mysql:8.0
    container_name: swiftbasket-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: swiftbasket_user
      MYSQL_PASSWORD: securepass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Mount the init file directly (the old ./mysql-init dir was empty,
      # so databases were never created)
      - ./mysql_init.sql:/docker-entrypoint-initdb.d/mysql_init.sql:Z
    networks:
      - swiftbasket-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      start_period: 40s

  # ------------------------------------------------------------
  # MongoDB - Stores Cart data (Flexible Schema)
  # ------------------------------------------------------------
  mongodb:
    image: docker.io/library/mongo:7.0
    container_name: swiftbasket-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db:Z
    networks:
      - swiftbasket-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      timeout: 10s
      retries: 5
      start_period: 40s

  # ------------------------------------------------------------
  # Redis - Caching for Cart Service
  # ------------------------------------------------------------
  redis:
    image: docker.io/library/redis:alpine
    container_name: swiftbasket-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - swiftbasket-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------
  # Zookeeper - Required for Kafka
  # ------------------------------------------------------------
  zookeeper:
    image: docker.io/confluentinc/cp-zookeeper:7.5.0
    container_name: swiftbasket-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      # ZooKeeper stores the Kafka cluster ID — it must persist alongside
      # kafka_data or the broker sees InconsistentClusterIdException on restart
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - swiftbasket-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc -w 2 localhost 2181"]
      timeout: 10s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------
  # Kafka - Message Broker
  # ------------------------------------------------------------
  kafka:
    image: docker.io/confluentinc/cp-kafka:7.5.0
    container_name: swiftbasket-kafka
    restart: always
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Listeners allow connecting from inside Podman (INTERNAL) and your Local Machine (EXTERNAL)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - swiftbasket-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server=localhost:9092"]
      timeout: 10s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------
  # Elasticsearch 8.x - For Product Search (single node, security off)
  # ------------------------------------------------------------
  elasticsearch:
    image: docker.io/library/elasticsearch:8.14.3
    container_name: swiftbasket-elastic
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data:Z
    networks:
      - swiftbasket-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"yellow\\|green\"'"]
      timeout: 10s
      retries: 5
      start_period: 40s

# ------------------------------------------------------------
# Volumes & Networks
# ------------------------------------------------------------
volumes:
  mysql_data:
    driver: local
  mongo_data:
    driver: local
  kafka_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_log:
    driver: local
  es_data:
    driver: local

networks:
  swiftbasket-net:
    driver: bridge
